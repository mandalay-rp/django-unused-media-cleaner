[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-unused-media-cleaner"
version = "0.1.0"
description = "Cleaning up the MEDIA_ROOT directory in Django project from unnecessary, unused files"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Alex Jurow", email = "your-email@example.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Django :: 3.2",
    "Framework :: Django :: 4.0",
    "Framework :: Django :: 4.1",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10"
dependencies = [
    "Django>=3.2",
    "six",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
]

[project.urls]
Homepage = "https://github.com/mandalay-rp/django-unused-media-cleaner"
Repository = "https://github.com/mandalay-rp/django-unused-media-cleaner"
Issues = "https://github.com/mandalay-rp/django-unused-media-cleaner/issues"

[tool.setuptools.packages.find]
include = ["unused_media_cleaner*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.testapp.settings"
python_files = ["test_*.py", "*_test.py"]
pythonpath = ["."]
addopts = "--cov=unused_media_cleaner --cov-report=term-missing"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.17.1",
]

[tool.ruff]
# Минимальная версия Python, на которую ориентируется линтер
target-version = "py310"
# Длина строки (можно изменить на 100 или 120 по вкусу)
line-length = 88
# Исключаем служебные директории
exclude = [
    ".bzr", ".direnv", ".eggs", ".git", ".hg",
    ".mypy_cache", ".pytest_cache", ".ruff_cache",
    ".venv", "venv", "__pycache__", "build", "dist",
]

[tool.ruff.lint]
# Базовый набор правил для качественного и безопасного кода
select = [
    "E",   # pycodestyle (стиль)
    "F",   # Pyflakes (логические ошибки)
    "W",   # pycodestyle (предупреждения)
    "I",   # isort (сортировка импортов)
    "UP",  # pyupgrade (современный синтаксис Python)
    "B",   # flake8-bugbear (поиск потенциальных багов)
    "DJ",  # flake8-django (специфичные для Django правила)
]
# Правила, которые мы сознательно игнорируем (пример: DJ008 — модель без __str__)
# ignore = ["DJ008"]

[tool.ruff.lint.per-file-ignores]
# Не применяем строгие правила к файлам миграций Django
"**/migrations/*.py" = ["E501", "RUF012"]

[tool.ruff.lint.isort]
# Настройка порядка импортов, как в isort, с выделением Django
known-first-party = ["unused_media_cleaner"]
section-order = ["future", "standard-library", "third-party", "django", "first-party", "local-folder"]
